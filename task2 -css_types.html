<!DOCTYPE html>
<html>
<head>
<title>CSS Types Example</title>

<!-- Internal CSS -->
<style>
h2{
    color: blue;
}

p{
    font-size:18px;
    color: green;
}
</style>

<!-- External CSS -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<h1 style="color:red;">Inline CSS Example</h1>
<p>This heading uses inline CSS.</p>

<h2>Internal CSS Example</h2>
<p>This paragraph is styled using internal CSS.</p>

<h3>External CSS Example</h3>
<div class="box">
This box is styled using external CSS.
</div>

</body>
</html>
