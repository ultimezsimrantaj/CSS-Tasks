<!DOCTYPE html>
<html>
<head>
<title>CSS Syntax Example</title>

<style>

/* CSS Syntax Example */

h1 {
    color: blue;
    text-align: center;
}

p {
    color: green;
    font-size: 18px;
}

.box {
    background-color: lightgray;
    padding: 20px;
    border: 2px solid black;
}

</style>

</head>

<body>

<h1>Learning CSS Syntax</h1>

<p>This paragraph is styled using CSS.</p>

<div class="box">
This is a box styled with CSS.
</div>

</body>
</html>
