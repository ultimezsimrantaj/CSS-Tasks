<!DOCTYPE html>
<html>
<head>
<title>CSS Box Model Example</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: lightgray;
}

/* Box Model Example */
.box{
    width: 300px;
    background-color: white;

    /* Content padding */
    padding: 20px;

    /* Border around element */
    border: 5px solid blue;

    /* Space outside the element */
    margin: 40px auto;

    text-align: center;
}

</style>

</head>

<body>

<h1 style="text-align:center;">CSS Box Model Example</h1>

<div class="box">
This box demonstrates the CSS Box Model including content, padding, border, and margin.
</div>

</body>
</html>
