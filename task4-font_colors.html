<!DOCTYPE html>
<html>
<head>
<title>CSS Fonts and Colors Example</title>

<style>

/* CSS Declaration Example */
h1 {
    color: blue;
    font-family: Arial;
    text-align: center;
}

/* Font Styling */
.font-example {
    font-family: "Times New Roman";
    font-size: 20px;
    font-style: italic;
}

/* Color Styling */
.color-example {
    color: white;
    background-color: green;
    padding: 10px;
}

/* Text Styling */
.text-example {
    text-decoration: underline;
    text-transform: uppercase;
    letter-spacing: 2px;
}

/* Multiple Declarations */
.box {
    border: 2px solid black;
    padding: 15px;
    margin: 10px;
}

</style>

</head>

<body>

<h1>CSS Fonts, Colors and Text Styles</h1>

<p class="font-example">
This paragraph demonstrates different font styles in CSS.
</p>

<p class="color-example">
This text shows how colors and background colors are applied.
</p>

<p class="text-example">
This text demonstrates text decoration and transformation.
</p>

<div class="box">
This box uses multiple CSS declarations like border, padding and margin.
</div>

</body>
</html>
