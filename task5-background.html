<!DOCTYPE html>
<html>
<head>
<title>Background and Borders Example</title>

<style>

/* Page background color */
body{
    background-color: lightblue;
}

/* Background image */
.background-image{
    background-image: url("background.jpg");
    background-size: cover;
    padding: 40px;
    color: white;
}

/* Border for heading */
h1{
    border: 3px solid black;
    padding: 10px;
}

/* Border styles for paragraphs */
.p1{
    border: 2px solid red;
}

.p2{
    border: 2px dashed green;
}

.p3{
    border: 2px dotted blue;
}

/* Border for div box */
.box{
    border: 4px double purple;
    padding: 20px;
    margin-top: 10px;
}

</style>

</head>

<body>

<h1>Background and Border Example</h1>

<div class="background-image">
This section has a background image.
</div>

<p class="p1">This paragraph has a solid border.</p>

<p class="p2">This paragraph has a dashed border.</p>

<p class="p3">This paragraph has a dotted border.</p>

<div class="box">
This div has a double border style.
</div>

</body>
</html>
